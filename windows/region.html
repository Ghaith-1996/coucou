<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coucou — pick a region</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        cursor: crosshair;
        font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      /* The dim covers everything but the selection (its box-shadow). */
      #dim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.32);
      }
      #dim.selecting {
        background: transparent;
      }
      #sel {
        position: fixed;
        display: none;
        outline: 1.5px solid #fff;
        box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.32);
      }
      #size {
        position: absolute;
        right: 0;
        bottom: -26px;
        padding: 2px 8px;
        border-radius: 6px;
        background: rgba(20, 20, 24, 0.9);
        color: #fff;
        font-size: 12px;
        white-space: nowrap;
      }
      #hint {
        position: fixed;
        left: 50%;
        top: 28px;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 10px;
        background: rgba(20, 20, 24, 0.92);
        color: #fff;
        pointer-events: none;
        white-space: nowrap;
      }
      #hint kbd {
        font: inherit;
        padding: 0 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.16);
      }
    </style>
  </head>
  <body>
    <div id="dim"></div>
    <div id="sel"><span id="size"></span></div>
    <div id="hint"></div>
    <script type="module" src="/src/region/main.ts"></script>
  </body>
</html>
